<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Muby — All Screens (MVP v6)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="styles/tokens.css" />
<style>
  body { background: #ddd5c7; }
  [data-theme="dark"] body, body.darkpage { background: #0f0b08; }
  .top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: rgba(221,213,199,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.06); }
  body.darkpage .top { background: rgba(15,11,8,0.85); border-color: rgba(255,255,255,0.08); }
  .title { font-weight: 700; font-size: 16px; color: #2A1A14; display: flex; align-items: center; gap: 10px; }
  body.darkpage .title { color: #F5EFE2; }
  .btn { padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.12); background: #FAF6EE; font-weight: 600; font-size: 13.5px; cursor: pointer; color: #2A1A14; }
  body.darkpage .btn { background: #241D17; color: #F5EFE2; border-color: rgba(255,255,255,0.12); }
  .wrap { padding: 36px; }
  .sec { margin-bottom: 14px; }
  .sec h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; color: #2A1A14; margin: 32px 0 6px; }
  body.darkpage .sec h2 { color: #F5EFE2; }
  .sec p { font-size: 13.5px; color: #6B5B52; margin: 0 0 18px; }
  body.darkpage .sec p { color: #B8AC9B; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; }
  .frame-wrap { display: flex; flex-direction: column; gap: 10px; }
  .frame-label { font-size: 13px; font-weight: 700; color: #2A1A14; }
  body.darkpage .frame-label { color: #F5EFE2; }
  .frame-label span { color: #9b8d7d; font-weight: 500; }
  .frame { width: 393px; background: var(--bg-canvas); border-radius: 20px; overflow: visible; position: relative; box-shadow: 0 4px 24px rgba(0,0,0,0.10); border: 1px solid rgba(0,0,0,0.06); }
  .frame > .inner { display: flex; flex-direction: column; min-height: 852px; }
  .frame > .inner > div:first-child { flex: 1; display: flex; flex-direction: column; }
  body.darkpage .frame { box-shadow: 0 4px 24px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.06); }
  .island { display: none; }
  /* Override inner scroll containers to show all content */
  .frame .screen-scroll, .frame .no-sb { overflow: visible !important; max-height: none !important; height: auto !important; flex: none !important; }
  .frame [style*="overflowY"] { overflow: visible !important; }
  .frame [style*="overflow"] { overflow: visible !important; }
  /* Wrap horizontal scroll rows so nothing bleeds outside the 393px frame */
  .frame .no-sb[style*="overflowX"], .frame [style*="overflow-x"], .frame [style*="overflowX"] { flex-wrap: wrap !important; row-gap: 10px; }
</style>
</head>
<body>
<div class="top">
  <div class="title"><span id="bf"></span> Muby — MVP v6 · Toàn bộ màn hình</div>
  <button class="btn" id="themeBtn">🌙 Xem chế độ tối</button>
</div>
<div class="wrap"><div id="root"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="screens/bong.jsx"></script>
<script type="text/babel" src="screens/data.jsx"></script>
<script type="text/babel" src="screens/components.jsx"></script>
<script type="text/babel" src="screens/today.jsx"></script>
<script type="text/babel" src="screens/auth.jsx"></script>
<script type="text/babel" src="screens/leap.jsx"></script>
<script type="text/babel" src="screens/growth.jsx"></script>
<script type="text/babel" src="screens/me.jsx"></script>
<script type="text/babel">
const { useState } = React;
function mkCtx(o = {}) {
  const noop = () => {};
  return {
    theme: 'light', intensity: 2, empty: false, premium: false,
    route: { flow: 'app', tab: 'today', stack: null }, sheet: null, paywall: null, toastVal: null,
    setTab: noop, go: noop, back: noop, goFlow: noop, setRoute: noop, openSheet: noop, closeSheet: noop,
    setIntensity: noop, setEmpty: noop, setPremium: noop, setTheme: noop, openPaywall: noop, closePaywall: noop, toast: noop,
    startTrial: noop, cancelTrial: noop, updateBaby: noop, setFaceId: noop, faceId: true,
    ...o,
  };
}

function Frame({ label, note, nav, children }) {
  return (
    <div className="frame-wrap">
      <div className="frame-label">{label} {note && <span>· {note}</span>}</div>
      <div className="frame">
        <div className="inner">
          <div style={{ display: 'flex', flexDirection: 'column' }}>{children}</div>
          {nav && <BottomNav active={nav} onNav={() => {}} onFab={() => {}} />}
        </div>
      </div>
    </div>
  );
}

function CardDemo({ children }) {
  return <div style={{ padding: '24px 20px', display: 'flex', flexDirection: 'column', justifyContent: 'flex-start' }}>{children}</div>;
}

function IntroAt({ i }) { return null; }

function Section({ title, desc, children }) {
  return (
    <div className="sec">
      <h2>{title}</h2>
      {desc && <p>{desc}</p>}
      <div className="row">{children}</div>
    </div>
  );
}

function Canvas() {
  return (
    <div>
      <Section title="Auth · A1–A3" desc="Passwordless — số điện thoại + OTP, không mật khẩu. Face ID cho lần sau.">
        <Frame label="A1" note="Welcome · Muby"><AuthFlow ctx={mkCtx({ route: { flow: 'auth', authStep: 'A1' } })} /></Frame>
        <Frame label="A2" note="Nhập SĐT"><AuthFlow ctx={mkCtx({ route: { flow: 'auth', authStep: 'A2' } })} /></Frame>
        <Frame label="A3" note="OTP"><AuthFlow ctx={mkCtx({ route: { flow: 'auth', authStep: 'A3' } })} /></Frame>
        <Frame label="A3" note="OTP — lỗi mạng"><A3 go={() => {}} ctx={mkCtx()} demoNetError={true} /></Frame>
      </Section>

      <Section title="Onboarding · 10A–10B" desc="2 màn — thêm bé kèm câu hỏi ngày dự sinh (leap tính theo dự sinh).">
        <Frame label="10A" note="Mừng mama"><OnboardFlow ctx={mkCtx({ route: { flow: 'onboard', obStep: 'ob1' } })} /></Frame>
        <Frame label="10B" note="Thêm bé + dự sinh"><OnboardFlow ctx={mkCtx({ route: { flow: 'onboard', obStep: 'ob2' } })} /></Frame>
      </Section>

      <Section title="1 · Hôm nay" desc="Cùng một khung — nội dung đổi theo thời tiết leap. Nắng: đếm ngày nắng + Hôm nay của bé + Kỹ năng đang nở.">
        <Frame label="1" note="Nắng (mức 2) — sunny redesign" nav="today"><TodayScreen ctx={mkCtx({ intensity: 2 })} /></Frame>
        <Frame label="1" note="Khó (mức 4)" nav="today"><TodayScreen ctx={mkCtx({ intensity: 4 })} /></Frame>
        <Frame label="1" note="Trống" nav="today"><TodayScreen ctx={mkCtx({ empty: true })} /></Frame>
        <Frame label="1" note="Đang tải (skeleton)" nav="today"><TodayScreen ctx={mkCtx({ loading: true })} /></Frame>
        <Frame label="1" note="Lỗi mạng — có bản lưu" nav="today"><TodayScreen ctx={mkCtx({ error: true })} /></Frame>
      </Section>

      <Section title="1B · Thẻ theo chu kỳ leap" desc="Hôm nay của bé (3 biến thể xoay theo ngày) · Chuẩn bị leap kế · Khoảnh khắc sau leap.">
        <Frame label="✨" note="T2/T4/T6 — Điều kỳ diệu"><CardDemo><TodayOfBabyCard ctx={mkCtx()} variant={{ kind: 'fact', label: '✨ Điều kỳ diệu hôm nay', text: 'Tuần này mắt bé bắt đầu nhìn rõ ở khoảng 40cm — đúng khoảng cách từ mặt mẹ khi cho bú. Không phải ngẫu nhiên đâu 💛' }} /></CardDemo></Frame>
        <Frame label="🎲" note="T3/T5/T7 — Trò 5 phút"><CardDemo><TodayOfBabyCard ctx={mkCtx()} variant={{ kind: 'game', label: '🎲 Trò 5 phút', text: 'Bé vừa học nối chuỗi hành động. Thử: lắc xúc xắc → dừng → đưa bé. Xem con có lắc theo không?' }} /></CardDemo></Frame>
        <Frame label="📸" note="CN — Khoảnh khắc tuần này"><CardDemo><TodayOfBabyCard ctx={mkCtx()} variant={{ kind: 'photo', label: '📸 Khoảnh khắc tuần này', text: 'Tuần này nhiều bé bắt đầu cười thành tiếng. Nếu Bống cười, quay lại 10 giây thôi — sau này xem lại sẽ tan chảy đó.', action: 'Lưu khoảnh khắc' }} /></CardDemo></Frame>
        <Frame label="☁️" note="Chuẩn bị cho Leap kế (5 ngày trước)"><CardDemo><PrepCard ctx={mkCtx()} /></CardDemo></Frame>
        <Frame label="🌼" note="Sau leap — premium moment"><CardDemo><PostLeapCard ctx={mkCtx({ intensity: 2 })} onDismiss={() => {}} /></CardDemo></Frame>
      </Section>

      <Section title="2 · Ghi nhanh & Dỗ bé" desc="Một chạm là xong. Soothing sheet với tiếng ồn trắng.">
        <Frame label="2" note="Ghi nhanh" nav="today"><TodayScreen ctx={mkCtx({ intensity: 2 })} /><QuickLogSheet ctx={mkCtx()} open={true} /></Frame>
        <Frame label="2B" note="Dỗ bé (Free)" nav="today"><TodayScreen ctx={mkCtx({ intensity: 4 })} /><SoothingSheet ctx={mkCtx({ intensity: 4 })} open={true} /></Frame>
      </Section>

      <Section title="3 · Leap" desc="3 sub-tab: Hôm nay · Hành trình · Lịch (77 tuần, màu chuyển sắc).">
        <Frame label="3A" note="Hôm nay" nav="leap"><LeapScreen ctx={mkCtx({ intensity: 4 })} initialSub="today" /></Frame>
        <Frame label="3B" note="Hành trình" nav="leap"><LeapScreen ctx={mkCtx({ intensity: 4 })} initialSub="journey" /></Frame>
        <Frame label="3C" note="Lịch" nav="leap"><LeapScreen ctx={mkCtx({ intensity: 4 })} initialSub="cal" /></Frame>
        <Frame label="4" note="Leap chi tiết"><LeapDetailScreen ctx={mkCtx({ intensity: 4 })} /></Frame>
      </Section>

      <Section title="5–8 · Lớn khôn, Nhật ký, Thư viện" desc="3 tab đối chiếu: cân nặng (WHO) · cữ ăn · giấc ngủ. Nhật ký có Khoảnh khắc 🎉 — không bao giờ bị khóa.">
        <Frame label="5" note="Cân nặng (WHO)" nav="growth"><GrowthScreen ctx={mkCtx()} /></Frame>
        <Frame label="5" note="Cữ ăn (đối chiếu)" nav="growth"><GrowthScreen ctx={mkCtx()} initialMetric="feed" /></Frame>
        <Frame label="5" note="Trống — chưa có số đo" nav="growth"><GrowthScreen ctx={mkCtx({ empty: true })} /></Frame>
        <Frame label="6" note="Thêm số đo"><MeasureScreen ctx={mkCtx()} /></Frame>
        <Frame label="7" note="Nhật ký"><HistoryScreen ctx={mkCtx()} /></Frame>
        <Frame label="7" note="Nhật ký — trống"><HistoryScreen ctx={mkCtx({ empty: true })} /></Frame>
        <Frame label="8" note="Thư viện"><LibraryScreen ctx={mkCtx()} /></Frame>
      </Section>

      <Section title="9 · Thông báo · Mama · Premium" desc="Reverse trial: 7 ngày đầu mở hết, không thẻ, không tự trừ tiền. Premium = mua một lần 199k.">
        <Frame label="9A" note="Thông báo"><NotificationsScreen ctx={mkCtx()} /></Frame>
        <Frame label="9A" note="Thông báo — trống"><NotificationsScreen ctx={mkCtx({ empty: true })} /></Frame>
        <Frame label="9B" note="Mama (Free)" nav="me"><MeScreen ctx={mkCtx()} /></Frame>
        <Frame label="9B" note="Mama — 7 ngày đầu (trải nghiệm mở)" nav="me"><MeScreen ctx={mkCtx({ trial: { daysLeft: 5 } })} /></Frame>
        <Frame label="9B" note="Mama (Premium)" nav="me"><MeScreen ctx={mkCtx({ premium: true, purchased: true })} /></Frame>
        <Frame label="—" note="Paywall — mua một lần"><MeScreen ctx={mkCtx()} /><Paywall ctx={mkCtx({ paywall: { title: 'Mở khóa Muby Premium' } })} /></Frame>
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
ReactDOM.createRoot(document.getElementById('bf')).render(<Flower size={22} color="var(--accent-primary)" />);

const btn = document.getElementById('themeBtn');
btn.onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? '' : 'dark';
  document.body.classList.toggle('darkpage', !dark);
  btn.textContent = dark ? '🌙 Xem chế độ tối' : '☀️ Xem chế độ sáng';
};
</script>
</body>
</html>
